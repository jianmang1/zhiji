[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiji-backend"
version = "0.1.0"
description = "执己个人数据中枢 API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1", "alembic>=1.13,<2", "pydantic-settings>=2.4,<3",
  "python-jose[cryptography]>=3.3,<4", "httpx>=0.27,<1", "email-validator>=2,<3",
  "cryptography>=42,<50"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "pytest-cov>=5,<7", "mypy>=1.10,<2", "ruff>=0.6,<1", "types-python-jose>=3.5,<4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
